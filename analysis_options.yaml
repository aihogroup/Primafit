# Static analysis configuration. CI runs `flutter analyze --fatal-warnings`,
# so warnings block merges; infos are tracked as tech debt.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: false # enable once legacy `Map<String, dynamic>` screens are typed
  errors:
    # Real bugs, not style: fail the build.
    use_build_context_synchronously: warning
    # Legacy screens fire-and-forget many futures (Navigator.push, initState
    # loads). Kept as info until those screens migrate; then promote to warning.
    unawaited_futures: info
    cancel_subscriptions: warning
    close_sinks: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
