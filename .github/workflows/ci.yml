name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check (new architecture layers)
        run: dart format --output=none --set-exit-if-changed lib/app lib/core lib/features/auth test
      - name: Static analysis
        run: flutter analyze --fatal-warnings --no-fatal-infos
      - name: Tests
        run: flutter test --coverage

  build-android:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Secrets come from GitHub Actions secrets, never from the repository.
      - name: Write build config
        run: |
          cat > env/ci.json <<EOF
          {
            "APP_ENV": "staging",
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_PUBLISHABLE_KEY": "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}",
            "NEWS_API_KEY": "${{ secrets.NEWS_API_KEY }}"
          }
          EOF
      - run: flutter build apk --release --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: primafit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
