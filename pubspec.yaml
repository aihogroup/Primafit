name: primafit
description: "Primafit - health super-app for users, doctors, institutions and partners."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.1.0+2

environment:
  sdk: ^3.12.0

# Dependencies are grouped by concern. Remove a package only after confirming
# it is not imported anywhere (`grep -r "package:<name>/" lib`).
dependencies:
  flutter:
    sdk: flutter

  # Architecture: state management & backend
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.17.2

  # Local persistence
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.2
  csv: ^6.0.0

  # Networking
  http: ^1.6.0
  cached_network_image: ^3.4.1
  webview_flutter: ^4.11.0
  url_launcher: ^6.3.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.1.0
  flutter_html: ^3.0.0
  fl_chart: ^0.71.0
  table_calendar: ^3.2.0
  flutter_staggered_animations: ^1.1.1
  flutter_colorpicker: ^1.1.0

  # Device & platform
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  share_plus: ^10.1.4
  geolocator: ^14.0.0
  device_info_plus: ^11.4.0
  flutter_local_notifications: ^18.0.0
  android_alarm_manager_plus: ^4.0.7
  timezone: ^0.10.0

  # Utilities
  intl: ^0.20.2
  pdf: ^3.11.3
  string_similarity: ^2.1.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  sqflite_common_ffi: ^2.4.3

flutter_native_splash:
  background_image: "assets/Splash/background.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/Intro/
    - assets/Splash/
    - assets/Navigation/
    - assets/avatar/
    - assets/fitur/
    - assets/csv/